<section class="admin">
  @if (admin.role() === 'admin') {
    <app-admin-dashboard />
  } @else if (!admin.unlocked()) {
    <div class="unlock-card">
      <h2>Admin</h2>
      <p class="lead">Adding, editing and deleting animals needs the admin key.</p>
      <form class="unlock" (ngSubmit)="unlock()" novalidate>
        <label for="admin-key">Admin key</label>
        <div class="row">
          <input
            id="admin-key"
            name="key"
            type="password"
            autocomplete="current-password"
            spellcheck="false"
            [ngModel]="key()"
            (ngModelChange)="key.set($event); error.set('')"
            [attr.aria-invalid]="error() ? 'true' : null"
            [attr.aria-describedby]="error() ? 'admin-key-error' : null"
          />
          <button type="submit" class="btn btn-primary" [disabled]="checking() || !key().trim()">
            {{ checking() ? 'Checking...' : 'Unlock' }}
          </button>
        </div>
        @if (error()) {
          <p id="admin-key-error" class="field-error" role="alert">{{ error() }}</p>
        }
      </form>
      <a class="btn btn-secondary btn-sm" routerLink="/">Back to list</a>
    </div>
  }
</section>
