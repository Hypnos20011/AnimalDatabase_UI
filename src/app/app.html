<header class="site-header">
  <div class="container header-inner">
    <a routerLink="/" class="brand">
      <h1>{{ title() }}</h1>
    </a>
    <nav class="site-nav" aria-label="Quick actions">
      <button type="button" class="nav-link" (click)="openRandom()">Random animal</button>
      @if (admin.unlocked()) {
        <a
          class="nav-link"
          routerLink="/animals/new"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
        >Add animal</a
        >
      }
      <a class="nav-link"
         routerLink="/stats"
         routerLinkActive="is-active"
         ariaCurrentWhenActive="page">Stats</a>
    </nav>
  </div>
</header>
<main class="container site-main">
  <router-outlet/>
</main>
<footer class="site-footer">
  <div class="container footer-inner">
    @if (admin.unlocked()) {
      <span class="footer-note">Editing unlocked</span>
      <button type="button" class="footer-link lock" (click)="lock()">Lock</button>
    } @else {
      <a class="footer-link admin" routerLink="/admin">Admin</a>
    }
  </div>
</footer>
